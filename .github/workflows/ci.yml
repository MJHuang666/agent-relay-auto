name: Validate release source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python for Markdown validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate source and generated release archive
        run: bash .github/scripts/validate-release.sh

      - name: Check whitespace errors
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  automated-runtime:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run automated Runner tests
        run: python3 -m unittest discover -s tests -v
      - name: Prove foreground Planner hybrid loop
        run: python3 -m unittest tests.test_hybrid_relay_e2e tests.test_protocol_failure -v
      - name: Prove original Planner auto-reporting
        run: python3 -m unittest tests.test_reporting_e2e tests.test_reporting_coordinator tests.test_planner_wake_cli_bridges tests.test_deepseek_harness_planner_wake -v
      - name: Validate Runner installer without installing launchd
        run: python3 shared/.agents/skills/agent-relay-auto/scripts/setup_runner.py install --source-skill shared/.agents/skills/agent-relay-auto --version ci --dry-run
